[project]
name = "youtube-transcript-extractor"
version = "0.1.0"
description = "A tool to extract transcripts from YouTube videos and playlists into Markdown format"
authors = [
    {name = "CJ Escudero"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "yt-dlp>=2024.3.10",
    "youtube-transcript-api>=0.6.2",
    "requests>=2.31.0",
    "typing-extensions>=4.9.0",
]
keywords = ["youtube", "transcript", "subtitles", "markdown", "playlist"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/yourusername/youtube-transcript-extractor"
Issues = "https://github.com/yourusername/youtube-transcript-extractor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/extraetranscripcionesyoutube"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.ruff]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []
target-version = "py38"
line-length = 100

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] 